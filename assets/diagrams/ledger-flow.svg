<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-label="Iron Ledger flow: a stock movement is written with its outbox event in PostgreSQL, relayed through RabbitMQ and stored in an append-only audit log. A transaction starts a Temporal saga that reserves and confirms stock, or releases the reservation on failure."><defs>
<linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2e32"/><stop offset="1" stop-color="#1e1f22"/></linearGradient>
<linearGradient id="cs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".20"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
<radialGradient id="glow" cx=".85" cy="0" r="1"><stop offset="0" stop-color="#6FE0C8" stop-opacity=".22"/><stop offset="1" stop-color="#6FE0C8" stop-opacity="0"/></radialGradient>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6FE0C8"/></marker>
<marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ff8a7a"/></marker></defs><rect x="0.5" y="0.5" width="899" height="371" rx="22" fill="url(#cg)" stroke="url(#cs)"/><text x="450.0" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#c7cdd3" text-anchor="middle" letter-spacing="0">Iron Ledger · how a change travels</text><text x="33" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#6FE0C8" text-anchor="start" letter-spacing="2">EVERY MUTATION LEAVES A TRACE</text><line x1="193" y1="125.0" x2="255" y2="125.0" stroke="#6FE0C8" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#ar)"/><line x1="419" y1="125.0" x2="481" y2="125.0" stroke="#6FE0C8" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#ar)"/><line x1="645" y1="125.0" x2="707" y2="125.0" stroke="#6FE0C8" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#ar)"/><circle r="4.5" fill="#6FE0C8"><animateMotion dur="4.5s" repeatCount="indefinite" path="M43 125.0 H857"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="4.5s" repeatCount="indefinite"/></circle><rect x="33" y="96" width="156" height="58" rx="14" fill="#232528" stroke="#fff" stroke-opacity=".18"/><text x="111.0" y="121" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f2f4f5" text-anchor="middle" letter-spacing="0">Stock movement</text><text x="111.0" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#aab1b8" text-anchor="middle" letter-spacing="0">REST · RBAC</text><rect x="259" y="96" width="156" height="58" rx="14" fill="#232528" stroke="#fff" stroke-opacity=".18"/><text x="337.0" y="121" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f2f4f5" text-anchor="middle" letter-spacing="0">PostgreSQL</text><text x="337.0" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#aab1b8" text-anchor="middle" letter-spacing="0">balance + outbox · 1 tx</text><rect x="485" y="96" width="156" height="58" rx="14" fill="#232528" stroke="#fff" stroke-opacity=".18"/><text x="563.0" y="121" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f2f4f5" text-anchor="middle" letter-spacing="0">RabbitMQ</text><text x="563.0" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#aab1b8" text-anchor="middle" letter-spacing="0">domain events</text><rect x="711" y="96" width="156" height="58" rx="14" fill="#232528" stroke="#fff" stroke-opacity=".18"/><text x="789.0" y="121" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f2f4f5" text-anchor="middle" letter-spacing="0">Audit log</text><text x="789.0" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#aab1b8" text-anchor="middle" letter-spacing="0">append-only</text><text x="33" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#6FE0C8" text-anchor="start" letter-spacing="2">EVERY TRANSACTION CAN BE UNDONE</text><line x1="193" y1="233.0" x2="255" y2="233.0" stroke="#6FE0C8" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#ar)"/><line x1="419" y1="233.0" x2="481" y2="233.0" stroke="#6FE0C8" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#ar)"/><line x1="645" y1="233.0" x2="707" y2="233.0" stroke="#6FE0C8" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#ar)"/><circle r="4.5" fill="#6FE0C8"><animateMotion dur="4.5s" repeatCount="indefinite" path="M43 233.0 H857"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="4.5s" repeatCount="indefinite"/></circle><rect x="33" y="204" width="156" height="58" rx="14" fill="#232528" stroke="#fff" stroke-opacity=".18"/><text x="111.0" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f2f4f5" text-anchor="middle" letter-spacing="0">Transaction</text><text x="111.0" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#aab1b8" text-anchor="middle" letter-spacing="0">REST · starts the saga</text><rect x="259" y="204" width="156" height="58" rx="14" fill="#232528" stroke="#fff" stroke-opacity=".18"/><text x="337.0" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f2f4f5" text-anchor="middle" letter-spacing="0">Temporal</text><text x="337.0" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#aab1b8" text-anchor="middle" letter-spacing="0">durable workflow</text><rect x="485" y="204" width="156" height="58" rx="14" fill="#232528" stroke="#fff" stroke-opacity=".18"/><text x="563.0" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f2f4f5" text-anchor="middle" letter-spacing="0">Reserve stock</text><text x="563.0" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#aab1b8" text-anchor="middle" letter-spacing="0">through the API</text><rect x="711" y="204" width="156" height="58" rx="14" fill="#232528" stroke="#fff" stroke-opacity=".18"/><text x="789.0" y="229" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f2f4f5" text-anchor="middle" letter-spacing="0">Confirm</text><text x="789.0" y="247" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#aab1b8" text-anchor="middle" letter-spacing="0">stock out + movement</text><rect x="711" y="286" width="156" height="58" rx="14" fill="#232528" stroke="#ff8a7a" stroke-dasharray="5 5"/><text x="789.0" y="311" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f2f4f5" text-anchor="middle" letter-spacing="0">Release</text><text x="789.0" y="329" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#aab1b8" text-anchor="middle" letter-spacing="0">reservation freed</text><path d="M563.0 266 V315.0 H707" fill="none" stroke="#ff8a7a" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ar2)"/><text x="575.0" y="307.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#ff8a7a" text-anchor="start" letter-spacing="0">on failure</text></svg>